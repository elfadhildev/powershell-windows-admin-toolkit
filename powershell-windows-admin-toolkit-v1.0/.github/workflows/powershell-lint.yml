name: PowerShell Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $results = Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
            if ($results) {
              $errors += $results
              $results | Format-Table -AutoSize
            }
          }

          if ($errors.Count -gt 0) {
            exit 1
          }

          Write-Host 'PSScriptAnalyzer validation passed.'
